<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="192" viewBox="0 0 1100 192" role="img">
<style>
  .title { font: 700 22px system-ui, -apple-system, Segoe UI, sans-serif; fill: #1f1f1f; }
