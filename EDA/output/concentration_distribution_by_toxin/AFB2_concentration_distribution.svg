<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="124" viewBox="0 0 1000 124" role="img">
<style>
  .title { font: 700 22px system-ui, -apple-system, Segoe UI, sans-serif; fill: #1f1f1f; }
  .label { font: 500 13px system-ui, -apple-system, Segoe UI, sans-serif; fill: #2a3142; }
  .value { font: 600 13px system-ui, -apple-system, Segoe UI, sans-serif; fill: #7A1517; }
  .axis { font: 12px system-ui, -apple-system, Segoe UI, sans-serif; fill: #6b6b6b; }
  .bar { fill: #9F1D20; }
  .line { fill: none; stroke: #9F1D20; stroke-width: 3; }
  .point { fill: #F4B41A; stroke: #7A1517; stroke-width: 1.5; }
  .axis-line { stroke: #e5dfd2; stroke-width: 1; }
</style>
<rect width="100%" height="100%" fill="#ffffff" />

<text x="24" y="34" class="title">AFB2 concentration distribution</text>
<text x="160" y="112" class="axis">Positive rows per concentration bin (ug/kg)</text>
<text x="24" y="82" class="label">1.09</text>
<rect x="160" y="64" width="720" height="22" rx="5" class="bar" />
<text x="888" y="80" class="value">1 positive row(s)</text>
<line x1="160" y1="88" x2="880" y2="88" class="axis-line" />
</svg>