<rect x="260" y="370" width="27" height="22" rx="5" class="bar" />
<text x="295" y="386" class="value">mean 3.79375 ug/kg; median 0.775</text>
<text x="24" y="422" class="label">OTA — Ochratoxin A</text>
<rect x="260" y="404" width="26" height="22" rx="5" class="bar" />
<text x="294" y="420" class="value">mean 3.65429 ug/kg; median 0.72</text>
<text x="24" y="456" class="label">DAS — Diacetoxyscirpenol</text>
<rect x="260" y="438" width="21" height="22" rx="5" class="bar" />
<text x="289" y="454" class="value">mean 2.93889 ug/kg; median 1.29</text>
<text x="24" y="490" class="label">TEA — Tenuazonic acid</text>
<rect x="260" y="472" width="18" height="22" rx="5" class="bar" />
<text x="286" y="488" class="value">mean 2.48875 ug/kg; median 2.745</text>
<text x="24" y="524" class="label">HT2 — HT-2 toxin</text>
<rect x="260" y="506" width="17" height="22" rx="5" class="bar" />
<text x="285" y="522" class="value">mean 2.32522 ug/kg; median 1.37</text>
<text x="24" y="558" class="label">ALT — Alternariol</text>
<rect x="260" y="540" width="16" height="22" rx="5" class="bar" />
<text x="284" y="556" class="value">mean 2.25667 ug/kg; median 1.92</text>
<text x="24" y="592" class="label">AME — Alternariol monomethyl ether</text>
<rect x="260" y="574" width="10" height="22" rx="5" class="bar" />
<text x="278" y="590" class="value">mean 1.418 ug/kg; median 1.05</text>
<text x="24" y="626" class="label">EMO — Emodin</text>
<rect x="260" y="608" width="9" height="22" rx="5" class="bar" />
