<text x="24" y="694" class="label">TEN — Tentoxin</text>
<rect x="260" y="676" width="7" height="22" rx="5" class="bar" />
<text x="275" y="692" class="value">mean 1.07 ug/kg; median 0.65</text>
<text x="24" y="728" class="label">ENNB1 — Enniatin B1</text>
<rect x="260" y="710" width="3" height="22" rx="5" class="bar" />
<text x="271" y="726" class="value">mean 0.45 ug/kg; median 0.17</text>
<line x1="260" y1="734" x2="980" y2="734" class="axis-line" />
</svg>