<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="226" viewBox="0 0 1100 226" role="img">
<style>
  .title { font: 700 22px system-ui, -apple-system, Segoe UI, sans-serif; fill: #1f1f1f; }
  .label { font: 500 13px system-ui, -apple-system, Segoe UI, sans-serif; fill: #2a3142; }
  .value { font: 600 13px system-ui, -apple-system, Segoe UI, sans-serif; fill: #7A1517; }
  .axis { font: 12px system-ui, -apple-system, Segoe UI, sans-serif; fill: #6b6b6b; }
  .bar { fill: #9F1D20; }
  .line { fill: none; stroke: #9F1D20; stroke-width: 3; }
  .point { fill: #F4B41A; stroke: #7A1517; stroke-width: 1.5; }
  .axis-line { stroke: #e5dfd2; stroke-width: 1; }
</style>
<rect width="100%" height="100%" fill="#ffffff" />

<text x="24" y="34" class="title">AFB1 mean positive concentration by province</text>
<text x="220" y="214" class="axis">Mean positive concentration (ug/kg)</text>
<text x="24" y="82" class="label">Yala</text>
<rect x="220" y="64" width="150" height="22" rx="5" class="bar" />
<text x="378" y="80" class="value">mean 12.41 ug/kg; max 24.32; 2/4 detected</text>
<text x="24" y="116" class="label">Ubon Ratchathani</text>
<rect x="220" y="98" width="760" height="22" rx="5" class="bar" />
<text x="988" y="114" class="value">mean 62.55 ug/kg; max 62.55; 1/43 detected</text>
<text x="24" y="150" class="label">Kampong Thom</text>
<rect x="220" y="132" width="697" height="22" rx="5" class="bar" />
<text x="925" y="148" class="value">mean 57.41 ug/kg; max 57.41; 1/2 detected</text>
<text x="24" y="184" class="label">Siem Reap</text>
<rect x="220" y="166" width="58" height="22" rx="5" class="bar" />
<text x="286" y="182" class="value">mean 4.79 ug/kg; max 4.79; 1/4 detected</text>
<line x1="220" y1="190" x2="980" y2="190" class="axis-line" />
</svg>